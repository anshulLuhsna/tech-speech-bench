[project]
name = "techspeechbench"
version = "0.1.0"
description = "Technical speech benchmark for software engineering and AI engineering dictation."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "faster-whisper>=1.1.1",
]

[dependency-groups]
train = [
  "accelerate>=0.34.0",
  "datasets>=2.20.0",
  "jiwer>=3.0.4",
  "librosa>=0.10.2",
  "peft>=0.12.0",
  "torch>=2.3.0",
  "transformers>=4.44.0",
]

[tool.uv]
package = false
